<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="earthGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#39BDE8"/>
      <stop offset="40%" stop-color="#0B5CAD"/>
      <stop offset="100%" stop-color="#061426"/>
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39BDE8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B5CAD" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  
  <!-- Atmospheric Glow -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#39BDE8" stroke-width="1" opacity="0.3"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#39BDE8" stroke-width="1.5" opacity="0.5"/>

  <!-- Earth Core Sphere -->
  <circle cx="32" cy="32" r="24" fill="url(#earthGrad)"/>

  <!-- Continents Silhouettes -->
  <path d="M 22 18 Q 28 14 34 18 Q 38 23 35 28 Q 28 32 23 27 Z" fill="#10B981" opacity="0.6"/>
  <path d="M 28 32 Q 35 30 38 36 Q 36 44 30 46 Q 26 42 27 36 Z" fill="#10B981" opacity="0.65"/>
  <path d="M 38 20 Q 44 22 43 27 Q 39 30 36 26 Z" fill="#10B981" opacity="0.55"/>

  <!-- Orbital Ring -->
  <ellipse cx="32" cy="32" rx="27" ry="10" fill="none" stroke="url(#orbitGrad)" stroke-width="2" transform="rotate(-28 32 32)"/>
  
  <!-- Satellite -->
  <circle cx="51" cy="22" r="3" fill="#39BDE8"/>
  <rect x="44" y="21" width="4" height="2" fill="#FFFFFF" rx="0.5"/>
  <rect x="54" y="21" width="4" height="2" fill="#FFFFFF" rx="0.5"/>
</svg>

